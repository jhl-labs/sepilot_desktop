[package]
name = "sepilot-launcher"
version = "0.1.0"
edition = "2021"
description = "Single-exe self-extracting launcher with persistent cache for sepilot-desktop"

[[bin]]
name = "sepilot-launcher"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
sevenz-rust2 = "0.18"
sha2 = "0.10"
hex = "0.4"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]
