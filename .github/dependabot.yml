version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The public tree is regenerated from the private source on every release,
    # so version-update PRs cannot land here. Security alerts and Dependabot
    # security updates still report vulnerable versions.
    open-pull-requests-limit: 0
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The public tree is regenerated from the private source on every release,
    # so version-update PRs cannot land here. Security alerts and Dependabot
    # security updates still report vulnerable versions.
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
